<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="moldura.js"></script>
<title>Conceito 4 · Prato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
:root{
  --bg:#FFF6EA;--fg:#3A2618;--muted:#8A7461;--line:#EBDAC5;--surface:#FFFBF5;
  --accent:#E8452C;--accent-fg:#FFF6EA;--radius:20px;--sheet-r:32px;
  --bar:#3A2618;--bar-fg:#E8D5C0;--bar-on:#FFD166;--bar-on-fg:#3A2618;
  --font:"IBM Plex Sans",system-ui,sans-serif;--display:"Fredoka",system-ui,sans-serif;--display-w:600;
}
body{font-feature-settings:"tnum" 1}
#palcoWrap{position:relative;overflow-x:clip}
#dieta{position:relative;display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#dieta::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;align-self:flex-start;scroll-snap-align:start;scroll-snap-stop:always;position:relative;
  padding:calc(50px + env(safe-area-inset-top)) 0 calc(130px + env(safe-area-inset-bottom))}
.cab{padding:0 24px;text-align:center;will-change:transform,opacity}
.cab small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cab h1{font-family:var(--display);font-size:36px;font-weight:600;line-height:1.05;letter-spacing:-.01em;margin:6px 0 0}

/* palco: o prato fica parado; a mancha gira e os ícones fazem a transição */
.cena{--D:min(88vw,344px);--R:calc(var(--D)*.335);position:relative;width:var(--D);height:var(--D);margin:22px auto 0;will-change:transform}
.mancha{position:absolute;inset:-3% -7%;background:var(--cor);border-radius:58% 42% 55% 45%/48% 56% 44% 52%;will-change:transform,opacity}
.prato{position:absolute;inset:0;border-radius:50%;background:#fff;
  box-shadow:0 16px 34px rgba(58,38,24,.18),inset 0 0 0 calc(var(--D)*.045) #fff,inset 0 0 0 calc(var(--D)*.052) var(--line)}
.centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;will-change:opacity,transform}
.centro b{display:block;font-family:var(--display);font-size:calc(var(--D)*.115);font-weight:600;line-height:1;letter-spacing:-.01em}
.centro span{display:block;font-size:13px;color:var(--muted);margin-top:5px;font-weight:500}
.slot{position:absolute;left:50%;top:50%;width:var(--S);height:var(--S);margin:calc(var(--S)/-2);padding:0;
  transform:rotate(var(--a)) translateX(var(--R)) rotate(calc(-1*var(--a)))}
.bolha{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:var(--S);
  background:color-mix(in srgb,var(--cor) 38%,#fff);will-change:transform,opacity}
.bolha .ic{width:.8em;height:.8em;vertical-align:0}
.bolha .emo{font-size:.62em;line-height:1}
.slot.fixo .bolha{background:color-mix(in srgb,var(--cor) 18%,#fff)}
.slot.fixo .bolha .ic{opacity:.75}
.slot.alt .bolha{box-shadow:0 0 0 3px var(--accent)}
.bolha .trk{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 2px #fff;font-size:16px}
.bolha .trk svg{width:13px;height:13px}
.slot.alt .trk{background:var(--accent)}

.info{max-width:440px;margin:46px auto 0;padding:0 18px}
.macros{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:12px}
.macros b{color:var(--fg);font-weight:600}
.rest{margin-top:8px;text-align:center}
.it-e{display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:color-mix(in srgb,var(--cor) 38%,#fff)}
.it-e .ic{width:78%;height:78%;vertical-align:0}
.it-e .emo{font-size:.55em}
.fixo .it-e{background:color-mix(in srgb,var(--cor) 16%,#fff)}
.alt .it-n,.alt .it-q{color:var(--accent)}
.alt .it-e{box-shadow:0 0 0 2.5px var(--accent)}
.it-sw{display:grid;place-items:center;flex:0 0 auto;color:var(--fg)}
.it-sw svg{width:16px;height:16px}
.it-n{font-weight:500;line-height:1.2}
.it-n small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.it-q{font-weight:600;font-variant-numeric:tabular-nums}
.fixo .it-n,.fixo .it-q{color:var(--muted)}

/* lista A: linhas largas */
.l-linhas{list-style:none;margin:0;padding:0}
.l-linhas li>*{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.l-linhas .it-e{width:60px;height:60px;font-size:60px}
.l-linhas .it-n{flex:1;min-width:0;font-size:16.5px}
.l-linhas .it-q{font-size:16px;text-align:right;max-width:34%}
.l-linhas .it-sw{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line)}
.l-linhas .sem{width:34px;flex:0 0 auto}

/* lista B: cartões em 2 colunas */
.l-cartoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.l-cartoes>*{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:24px;text-align:left;
  background:color-mix(in srgb,var(--cor) 22%,#fff);min-height:168px}
.l-cartoes .it-e{width:76px;height:76px;font-size:76px;background:#fff}
.l-cartoes .it-q{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.05;margin-top:auto}
.l-cartoes .it-n{font-size:14px}
.l-cartoes .it-n small{font-size:12px}
.l-cartoes .it-sw{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#fff}
.l-cartoes .fixo{background:transparent;border:1.5px dashed var(--line)}
.l-cartoes .alt{box-shadow:inset 0 0 0 2px var(--accent)}

/* lista C: mosaico em 3 colunas */
.l-mosaico{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.l-mosaico>*{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 2px}
.l-mosaico .it-e{width:84px;height:84px;font-size:84px}
.l-mosaico .it-q{font-size:15px;margin-top:2px}
.l-mosaico .it-n{font-size:12.5px;color:var(--muted);font-weight:400}
.l-mosaico .it-n small{display:none}
.l-mosaico .it-sw{position:absolute;top:2px;right:calc(50% - 46px);width:28px;height:28px;border-radius:50%;background:var(--fg);color:#fff;box-shadow:0 0 0 2px var(--bg)}
.l-mosaico .alt .it-sw{background:var(--accent)}
.l-mosaico .it-sw svg{width:14px;height:14px}

/* lista D: pílulas com o ícone saltando para fora */
.l-pilulas{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:18px}
.l-pilulas li>*{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:6px 12px 6px 0;border-radius:999px;text-align:left;
  background:color-mix(in srgb,var(--cor) 26%,#fff)}
.l-pilulas .it-e{width:78px;height:78px;font-size:78px;margin:0 0 0 -14px;background:#fff;box-shadow:0 6px 16px rgba(58,38,24,.14)}
.l-pilulas .it-n{flex:1;min-width:0;font-size:16px}
.l-pilulas .it-q{background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.l-pilulas .it-sw{width:36px;height:36px;border-radius:50%;background:var(--fg);color:#fff}
.l-pilulas .alt .it-sw{background:var(--accent)}
.l-pilulas .sem{width:0}
.l-pilulas .fixo{background:transparent;border:1.5px dashed var(--line)}

.tot{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:340px;margin:30px auto 0}
.tot div{width:150px;height:150px;border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--cor)}
.tot b{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}
.tot span{font-size:13px;margin-top:4px;font-weight:500}
.pager{position:absolute;top:calc(18px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:5}
.pager button{position:relative;width:9px;height:9px;border-radius:5px;background:var(--fg);opacity:.2;padding:0;transition:width .25s cubic-bezier(.32,.72,0,1),opacity .2s}
.pager button::after{content:"";position:absolute;inset:-14px -3px}
.pager button.on{width:26px;opacity:.85}
/* ao rolar: a composição do prato encolhe até a metade presa pelo topo, e a lista sobe junto,
   já no mesmo movimento. Os ícones encolhem menos (85%, 80% ou 70% do tamanho, à escolha no menu):
   como o prato inteiro vai a 50%, cada ícone recebe uma contra-escala de --ice. */
:root{--P:172px}
/* ícones terminam em 80% do tamanho original */
body{--ice:1.6}
.cena{transform-origin:50% 0}
.esc{position:absolute;inset:0}
@keyframes encolhe{to{transform:scale(.5)}}
@keyframes sobe{to{transform:translateY(calc(var(--P) * -1))}}
/* e vão saindo para a borda do prato: no fim ficam metade dentro, metade fora (raio de .335D para .5D) */
@keyframes contra{to{transform:translate(calc(var(--cx) * var(--D) * .165),calc(var(--sy) * var(--D) * .165)) scale(var(--ice))}}
@keyframes apaga{to{opacity:0}}
@supports (animation-timeline: scroll()){
  #palco .cena,.slide .cena{animation:encolhe linear both;animation-timeline:scroll(root block);animation-range:0 var(--P)}
  #palco .esc{animation:contra linear both;animation-timeline:scroll(root block);animation-range:0 var(--P)}
  .slide .info{animation:sobe linear both;animation-timeline:scroll(root block);animation-range:0 var(--P)}
  #palco .centros{animation:apaga linear both;animation-timeline:scroll(root block);animation-range:0 calc(var(--P) * .6)}
}
body:not([data-view="dieta"]) .pager,body:not([data-view="dieta"]) #palco{display:none}
/* camada visual fixa por cima do carrossel; os toques passam para os botões invisíveis da tela */
#palco{position:absolute;left:0;right:0;top:calc(50px + env(safe-area-inset-top));z-index:4;pointer-events:none}
#palco .p-cab{display:grid}
#palco .p-cab>*{grid-area:1/1}
#palco .cena{margin-top:22px}
.slide .cab.vaga{visibility:hidden}
.slide .cena .bolha{opacity:0}
.slide .cena .slot:focus-visible{outline:2px solid var(--accent);border-radius:50%}
</style>
</head>
<body>
<div class="pager" id="pager"></div>
<main id="dieta"></main>
<script src="dados.js"></script>
<script src="icones/a.js"></script><script src="icones/b.js"></script><script src="icones/c.js"></script>
<script>
window.OPCOES_EXTRA = [{ k: 'lista', t: 'Lista do prato', v: [['pilulas','Pílulas'],['linhas','Linhas'],['cartoes','Cartões'],['mosaico','Mosaico']] }];
</script>
<script src="motor.js"></script>
<script>
const CORES = ['#FFD166','#FFB4A2','#B8E0D2','#CDB4DB','#A2D2FF','#FFC8DD'];
const car = document.getElementById('dieta'), pager = document.getElementById('pager');
const ic = e => e.startsWith('<svg') ? e : '<span class="emo">' + e + '</span>';
let fatias = [];

function itemLista(D, x, tipo){
  const cls = `${x.it.fixo ? 'fixo' : ''} ${x.l.orig ? '' : 'alt'}`;
  const sub = x.l.medida ? `<small>${x.l.medida}</small>` : x.l.alt ? `<small>${D.esc(x.l.alt)}</small>` : '';
  const sw = x.it.trocavel ? `<span class="it-sw">${D.ico.swap}</span>` : '<span class="sem"></span>';
  const e = `<span class="it-e">${ic(x.l.emoji)}</span>`, n = `<span class="it-n">${D.esc(x.l.nome)}${sub}</span>`, q = `<span class="it-q">${x.l.txt}</span>`;
  const inner = (tipo === 'cartoes' || tipo === 'mosaico') ? e + q + n + (x.it.trocavel ? sw : '') : e + n + q + sw;
  const el = x.it.trocavel ? `<button class="${cls}" data-swap="${x.it.id}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
  return (tipo === 'linhas' || tipo === 'pilulas') ? `<li>${el}</li>` : el;
}

const palco = document.createElement('div'); palco.id = 'palco'; palco.setAttribute('aria-hidden', 'true');
const wrap = document.createElement('div'); wrap.id = 'palcoWrap';
document.body.insertBefore(wrap, car); wrap.append(palco, car);
let camadas = [], prato = null, nMeals = 0;

function slots(D, ls, n, vis){
  return ls.map((x,j) => {
    const a = j/n*360 - 90, rad = a * Math.PI / 180;
    const st = `style="--a:${a.toFixed(1)}deg;--cx:${Math.cos(rad).toFixed(4)};--sy:${Math.sin(rad).toFixed(4)}" data-ang="${a.toFixed(1)}"`;
    const cls = `slot ${x.it.fixo?'fixo':''} ${x.l.orig?'':'alt'}`;
    const b = vis ? `<span class="esc"><span class="bolha">${ic(x.l.emoji) + (x.it.trocavel ? `<span class="trk">${D.ico.swap}</span>` : '')}</span></span>` : `<span class="bolha"></span>`;
    return (!vis && x.it.trocavel)
      ? `<button class="${cls}" ${st} data-swap="${x.it.id}" aria-label="Trocar ${D.esc(x.l.nome)}">${b}</button>`
      : `<span class="${cls}" ${st}>${b}</span>`;
  }).join('');
}

function renderDieta(D){
  const x = car.scrollLeft, ms = D.meals(), tipo = D.ui().lista;
  nMeals = ms.length;
  const dados = ms.map(m => { const ls = m.itens.flatMap(it => it.linhas.map(l => ({it, l}))); return { m, ls, n: ls.length, S: Math.min(.225, 2*Math.PI*.335/ls.length*.86) }; });
  const cab = (m, k) => `<small>Refeição ${k+1} de ${ms.length}</small><h1>${m.nome}</h1>`;

  car.innerHTML = dados.map(({m, ls, n, S}, k) => {
    const tag = (tipo === 'linhas' || tipo === 'pilulas') ? 'ul' : 'div';
    return `<section class="slide" style="--cor:${CORES[k]}" aria-label="${m.nome}">
      <div class="cab vaga">${cab(m, k)}</div>
      <div class="cena" style="--S:calc(var(--D)*${S.toFixed(3)})">${slots(D, ls, n, false)}</div>
      <div class="info">
        <div class="macros"><span><b>${m.carb} g</b> carboidrato</span><span><b>≈${m.prot} g</b> proteína</span></div>
        <${tag} class="l-${tipo}">${ls.map(x => itemLista(D, x, tipo)).join('')}</${tag}>
        ${m.alterada?`<div class="rest"><button class="b-link" data-reset-meal="${m.i}">Restaurar refeição</button></div>`:''}
      </div>
    </section>`;
  }).join('') + `<section class="slide" style="--cor:${CORES[0]}" aria-label="Resumo do dia">
      <div class="cab"><small>Resumo</small><h1>No dia inteiro</h1></div>
      <div class="tot">${D.indicadores().map((i,k) => `<div style="--cor:${CORES[k]}"><b>${i.v}</b><span>${i.u} ${i.l}</span></div>`).join('')}</div>
    </section>`;

  palco.innerHTML = `<div class="p-cab">${dados.map(({m}, k) => `<div class="cab">${cab(m, k)}</div>`).join('')}</div>
    <div class="cena">
      ${dados.map((_, k) => `<div class="mancha" style="--cor:${CORES[k]}"></div>`).join('')}
      <div class="prato"></div>
      <div class="centros" style="position:absolute;inset:0">${dados.map(({m}) => `<div class="centro"><div><b>${m.hora}</b><span>${m.kcal} kcal</span></div></div>`).join('')}</div>
      ${dados.map(({ls, n, S}, k) => `<div class="grupo" style="--cor:${CORES[k]};--S:calc(var(--D)*${S.toFixed(3)});position:absolute;inset:0">${slots(D, ls, n, true)}</div>`).join('')}
    </div>`;

  fatias = [...car.children].map(s => ({ s, cab: s.querySelector('.cab') }));
  const cabs = palco.querySelectorAll('.p-cab .cab'), manchas = palco.querySelectorAll('.mancha'),
        centros = palco.querySelectorAll('.centro'), grupos = palco.querySelectorAll('.grupo');
  camadas = dados.map((_, k) => ({ cab: cabs[k], mancha: manchas[k], centro: centros[k], grupo: grupos[k],
    ics: [...grupos[k].querySelectorAll('.slot')].map(sl => ({ b: sl.querySelector('.bolha'), a: +sl.dataset.ang * Math.PI / 180 })) }));
  prato = palco.querySelector('.prato');
  palco.cena = palco.querySelector('.cena');

  pager.innerHTML = fatias.map((_, k) => `<button aria-label="Ir para ${k < ms.length ? ms[k].nome : 'resumo'}"></button>`).join('');
  [...pager.children].forEach((b, k) => b.onclick = () => car.scrollTo({left: fatias[k].s.offsetLeft, behavior: 'smooth'}));
  car.scrollLeft = x; quadro();
}

/* uma transição diferente por refeição. t vai de 0 (no prato) a 1 (fora); lado = -1 saindo para a esquerda, +1 chegando pela direita */
const cl = v => Math.max(0, Math.min(1, v));
const ease = t => t * t * (3 - 2 * t);
/* giro: todos rodam no mesmo sentido em volta do prato; quem sai termina antes da metade do arrasto
   e quem chega só aparece depois dela, então nunca se sobrepõem */
const GIRO = (t, a, R, lado) => { const p = a + lado * t * Math.PI * .6; return { x: R * (Math.cos(p) - Math.cos(a)), y: R * (Math.sin(p) - Math.sin(a)), s: 1 - t * .6, r: lado * t * 30, o: 1 - t * t }; };
const EFEITOS = [
  /* café: cada ícone sai para o seu lado */
  (t, a, i, R, W) => { const s = Math.cos(a) > .05 ? 1 : Math.cos(a) < -.05 ? -1 : (i % 2 ? 1 : -1); return { x: s * t * W * .75, y: -t * 30, s: 1 - t * .6, r: s * t * 40, o: 1 - t }; },
  /* almoço: giram em volta do prato e encolhem */
  (t, a, i, R, W, lado) => { const p = a + lado * t * Math.PI * 1.1; return { x: R * (Math.cos(p) - Math.cos(a)), y: R * (Math.sin(p) - Math.sin(a)), s: 1 - t * .85, r: 0, o: 1 - t * .9 }; },
  /* lanche: sugados para o centro */
  (t, a, i, R) => ({ x: -Math.cos(a) * R * t, y: -Math.sin(a) * R * t, s: 1 - t * .95, r: t * 160, o: 1 - t }),
  /* lanche 2: caem para fora */
  (t, a, i, R, W, lado) => ({ x: 0, y: t * 520 * (lado < 0 ? 1 : -1), s: 1 - t * .3, r: (i % 2 ? 1 : -1) * t * 50, o: 1 - t * .8 }),
  /* jantar: estouram um por um, sem sair do lugar */
  (t) => ({ x: 0, y: 0, s: 1 - t, r: 0, o: 1 - t }),
  /* ceia: explodem para fora do prato */
  (t, a, i, R) => ({ x: Math.cos(a) * R * 1.4 * t, y: Math.sin(a) * R * 1.4 * t, s: 1 - t * .4, r: 0, o: 1 - t })
];

let raf = 0;
function quadro(){
  raf = 0;
  if (!fatias.length) return;
  const W = car.clientWidth || 1, x = car.scrollLeft, max = car.scrollWidth - car.clientWidth;
  let atual = 0, melhor = 1e9;
  fatias.forEach((f, k) => { const dd = Math.abs(f.s.offsetLeft - x); if (dd < melhor) { melhor = dd; atual = k; } });
  if (x >= max - 2) atual = fatias.length - 1;
  const fr = x / (car.clientWidth || 1), k0 = Math.abs(fr - Math.round(fr)) > .01 ? (fr > atual ? atual + 1 : atual - 1) : -1;
  [...pager.children].forEach((b, k) => b.classList.toggle('on', k === atual));
  fatias.atual = atual;
  /* a página só é tão alta quanto a refeição atual: sem espaço vazio no fim da rolagem */
  const alt = Math.max(fatias[atual].s.offsetHeight, k0 >= 0 ? fatias[k0].s.offsetHeight : 0);
  if (car.style.height !== alt + 'px') car.style.height = alt + 'px';

  const resumo = fatias[nMeals];
  const dr = cl((resumo.s.offsetLeft - x) / W);
  prato.style.opacity = dr;
  prato.style.transform = `scale(${.85 + .15 * dr})`;
  const R = palco.cena.clientWidth * .335;

  camadas.forEach((c, k) => {
    const d = (fatias[k].s.offsetLeft - x) / W, ad = Math.min(1, Math.abs(d)), lado = d < 0 ? -1 : 1;
    const vis = Math.abs(d) < 1;
    c.grupo.style.visibility = c.mancha.style.visibility = c.centro.style.visibility = c.cab.style.visibility = vis ? '' : 'hidden';
    if (!vis) return;
    c.cab.style.opacity = cl(1 - ad * 2.2);
    c.cab.style.transform = `translate3d(${d * 40}px,0,0)`;
    c.centro.style.opacity = cl(1 - ad * 2.4);
    c.centro.style.transform = `scale(${1 - ad * .25})`;
    c.mancha.style.transform = `rotate(${k * 37 + d * 150}deg) scale(${1 - ad * .1})`;
    c.mancha.style.opacity = cl(1 - ad);
    const n = c.ics.length;
    c.ics.forEach((ic, i) => {
      /* todos juntos, como um anel rígido: a distância entre eles nunca muda, então não se encostam */
      const t = ease(cl(ad * 2));

      ic.b.style.transform = `translate3d(${v.x}px,${v.y}px,0) rotate(${v.r}deg) scale(${Math.max(.01, v.s)})`;
      ic.b.style.opacity = cl(v.o);
    });
  });
}
car.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(quadro); }, { passive: true });
const medirP = () => document.documentElement.style.setProperty('--P', (Math.min(innerWidth * .88, 344) * .5).toFixed(1) + 'px');
