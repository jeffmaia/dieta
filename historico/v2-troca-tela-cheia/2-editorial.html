<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conceito 2 · Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
:root{
  --bg:#F6F1E7;--fg:#1B1A17;--muted:#7A746A;--line:#DDD5C6;--surface:#FBF8F1;
  --accent:#C2410C;--accent-fg:#FFF7F0;--radius:4px;--sheet-r:6px;
  --bar:#1B1A17;--bar-fg:#CFC8BA;--bar-on:#F6F1E7;--bar-on-fg:#1B1A17;
  --font:"Inter Tight",system-ui,sans-serif;--display:"Instrument Serif",Georgia,serif;--display-w:400;
}
.pg-head h1,.sh-head h3,.alt-mh h2{font-style:italic}
.pg-head h1{font-size:56px}
.sh-head h3{font-size:32px}
#dieta{max-width:560px;margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 22px calc(130px + env(safe-area-inset-bottom))}
.capa{font-family:var(--display);font-size:clamp(64px,21vw,104px);line-height:.86;letter-spacing:-.03em;margin:0}
.capa i{display:block;padding-left:.5em}
.ref{margin-top:64px}
.ref-n{font-family:var(--display);font-size:15px;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px solid var(--fg);padding-bottom:6px}
.ref h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:48px;line-height:1;letter-spacing:-.02em;margin:14px 0 10px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);width:100%;min-height:52px}
.it .n{font-size:17px;font-weight:500}
.it .q{font-family:var(--display);font-size:23px;line-height:1.1;text-align:right;max-width:46vw}
.it small{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.it small u{color:var(--accent);text-underline-offset:3px;font-weight:600}
.it.fixo .n,.it.fixo .q{color:var(--muted)}
.it.alt .n,.it.alt .q{color:var(--accent)}
.ref-f{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);letter-spacing:.04em;margin-top:6px;min-height:44px}
.tot{margin-top:76px;border-top:1px solid var(--fg);padding-top:8px}
.tot h2{font-size:15px;font-family:var(--display);letter-spacing:.14em;color:var(--muted);font-weight:400;margin:0 0 18px;text-transform:uppercase}
.tot div{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.tot b{font-family:var(--display);font-weight:400;font-size:60px;line-height:1;letter-spacing:-.02em}
.tot span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main id="dieta"></main>
<script src="dados.js"></script>
<script src="motor.js"></script>
<script>
function renderDieta(D){
  document.getElementById('dieta').innerHTML = `<h1 class="capa">A dieta<i>do dia</i></h1>` + D.meals().map((m,k) => `
    <section class="ref">
      <div class="ref-n"><span>Nº ${String(k+1).padStart(2,'0')}</span><span>${m.hora}</span></div>
      <h2>${m.nome}</h2>
      ${m.itens.map(it => it.linhas.map((l,j) => {
        const sub = [l.medida || l.alt, it.trocavel && j === 0 ? `<u>${it.alterado?'trocar de novo':'trocar'}</u>` : ''].filter(Boolean).join(' · ');
        const inner = `<span class="n">${D.esc(l.nome)}</span><span class="q">${l.txt}</span>${sub?`<small>${sub}</small>`:''}`;
        const cls = `it ${it.fixo?'fixo':''} ${l.orig?'':'alt'}`;
        return it.trocavel ? `<button class="${cls}" data-swap="${it.id}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
      }).join('')).join('')}
      <div class="ref-f"><span>${m.kcal} kcal · ${m.carb} g carb · ≈${m.prot} g prot</span>
        ${m.alterada?`<button class="b-link" data-reset-meal="${m.i}">Restaurar</button>`:''}</div>
    </section>`).join('') + `
    <section class="tot"><h2>No dia inteiro</h2>
      ${D.indicadores().map(i => `<div><b>${i.v}</b><span>${i.u} ${i.l}</span></div>`).join('')}
    </section>`;
}
D.init();
</script>
</body>
</html>
