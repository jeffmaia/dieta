<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="moldura.js"></script>
<title>Conceito 3 · Linha do dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
:root{
  --bg:#0D0F0A;--fg:#F1F4E8;--muted:#8C927E;--line:#2A2F22;--surface:#151811;
  --accent:#C6F432;--accent-fg:#141A00;--radius:16px;--warn:#FFB26B;
  --bar:rgba(30,34,24,.9);--bar-fg:#B9C0A8;--bar-on:#C6F432;--bar-on-fg:#141A00;
  --font:"Space Grotesk",system-ui,sans-serif;--display:"Space Grotesk",system-ui,sans-serif;--display-w:700;
}
.mono{font-family:"Space Mono",ui-monospace,monospace}
#dieta{max-width:560px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 20px calc(130px + env(safe-area-inset-bottom))}
.topo{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0 0 34px}
.topo span{color:var(--accent)}
.linha{position:relative;padding-left:30px}
.linha::before{content:"";position:absolute;left:6px;top:8px;bottom:0;width:2px;background:linear-gradient(var(--accent),var(--line) 30%,var(--line))}
.ref{position:relative;padding-bottom:38px}
.ref::before{content:"";position:absolute;left:-30px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ref.alterada::before{background:var(--accent);box-shadow:0 0 0 5px rgba(198,244,50,.16)}
.ref-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ref-h time{font-size:12.5px;color:var(--muted)}
.ref h2{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1;width:100%}
.ref-m{font-size:12px;color:var(--muted);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:6px 14px 6px 10px;border-radius:999px;
  background:#1B1F15;border:1.5px solid var(--line);font-size:14.5px;font-weight:500;max-width:100%}
.chip .e{font-size:20px}
.chip b{font-weight:700;color:var(--accent);white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.chip.fixo{background:transparent;border-style:dashed;color:var(--muted)}
.chip.fixo b{color:var(--muted);font-weight:500}
.chip.alt{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.alt b,.chip.alt svg{color:var(--accent-fg)}
.ref .b-link{margin-top:6px}
.tot{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.tot div{border-radius:26px 26px 26px 6px;background:#1B1F15;padding:18px}
.tot div:nth-child(even){border-radius:26px 26px 6px 26px}
.tot b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tot span{font-size:12px;color:var(--muted)}
.tot-t{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:26px 0 0}
</style>
</head>
<body>
<main id="dieta"></main>
<script src="dados.js"></script>
<script src="icones/a.js"></script><script src="icones/b.js"></script><script src="icones/c.js"></script>
<script src="motor.js"></script>
<script>
function renderDieta(D){
  const ms = D.meals();
  document.getElementById('dieta').innerHTML = `<h1 class="topo">Seu dia<span>.</span></h1><div class="linha">` + ms.map(m => `
    <section class="ref ${m.alterada?'alterada':''}">
      <div class="ref-h"><time class="mono">${m.hora}</time><h2>${m.nome}</h2></div>
      <div class="ref-m mono">${m.kcal} kcal · ${m.carb} g carb · ≈${m.prot} g prot</div>
      <div class="chips">${m.itens.map(it => it.linhas.map(l => {
        const inner = `<span class="e">${l.emoji}</span><span>${D.esc(l.nome)}</span><b>${l.txt}</b>${it.trocavel?D.ico.swap:''}`;
        const cls = `chip ${it.fixo?'fixo':''} ${l.orig?'':'alt'}`;
        return it.trocavel ? `<button class="${cls}" data-swap="${it.id}" aria-label="Trocar ${D.esc(l.nome)}">${inner}</button>` : `<span class="${cls}">${inner}</span>`;
      }).join('')).join('')}</div>
      ${m.alterada?`<button class="b-link" data-reset-meal="${m.i}">Restaurar refeição</button>`:''}
    </section>`).join('') + `</div>
    <p class="tot-t mono">No dia inteiro</p>
    <div class="tot">${D.indicadores().map(i => `<div><b>${i.v}</b><span class="mono">${i.u} ${i.l}</span></div>`).join('')}</div>`;
}
D.init();
</script>
</body>
</html>
