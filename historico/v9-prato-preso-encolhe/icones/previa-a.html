<!doctype html><meta charset="utf-8"><title>Prévia a</title><style>body{margin:0;font:12px sans-serif}section{padding:12px}.grid{display:flex;flex-wrap:wrap;gap:12px}.i{width:110px;text-align:center}.s .i{width:40px}.s span{display:none}svg{display:block;margin:auto}h3{margin:0 0 8px}</style><body></body><script src="a.js"></script><script>
const bgs=[["#FFFFFF","#222"],["#1E1E24","#eee"],["#F2994A","#222"],["#6FB5A3","#222"]];

</script>
